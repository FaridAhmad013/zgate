# Production Nginx Reverse Proxy Configuration for zcode-gateway
# Place in: /etc/nginx/sites-available/zcode-gateway.conf
# Enable with: ln -s /etc/nginx/sites-available/zcode-gateway.conf /etc/nginx/sites-enabled/

upstream zcode_backend {
    server 127.0.0.1:20131;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.example.com;

    # SSL Certificates (Managed by certbot or manual)
    # Generate self-signed test cert: openssl req -x509 -newkey rsa:2048 -keyout /etc/ssl/private/zcode.key -out /etc/ssl/certs/zcode.crt -days 365 -nodes -subj '/CN=ai.example.com'
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Request size matching gateway DefaultMaxBodyBytes (32 MiB)
    client_max_body_size 32M;

    # Reverse proxy to local zcode-gateway instance
    location / {
        proxy_pass http://zcode_backend;

        # HTTP/1.1 required for chunked transfer and keepalive connections
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve client Host header for ZCODE_ALLOWED_HOSTS validation
        proxy_set_header Host $host;

        # Standard forwarded headers for ZCODE_TRUSTED_PROXIES evaluation
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for SSE Streaming (OpenAI / Anthropic deltas):
        # proxy_buffering off prevents Nginx from withholding stream chunks
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts to support deep reasoning models without premature cuts
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Internal healthcheck probe pass-through
    location = /healthz {
        proxy_pass http://zcode_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
