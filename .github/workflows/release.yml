name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64, ext: ".exe"}
          - {goos: linux, goarch: amd64, ext: ""}
          - {goos: darwin, goarch: amd64, ext: ""}
          - {goos: darwin, goarch: arm64, ext: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o "dist/zgate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/zcode-gateway
      - uses: actions/upload-artifact@v4
        with:
          name: zgate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ZGate $GITHUB_REF_NAME" \
            --notes "## ZGate $GITHUB_REF_NAME Release Notes

ZGate $GITHUB_REF_NAME is a hardened AI inference gateway for Z.ai Start-Plan lanes with single-binary Go stdlib architecture, native multi-account scheduling, and embedded Web Management Dashboard.

### What's New

1. **Embedded Web Management Dashboard**
   - Braun / Teenage Engineering-inspired industrial Hardware Synth user interface.
   - Real-time rolling request monitor (recessed CRT telemetry screen).
   - Upstream quota monitoring with physical segmented LED progress bars.
   - One-click 9Router fast setup configuration generator.

2. **Hardened Multi-Account Scheduling**
   - Least-In-Flight round-robin account routing for fair quota distribution.
   - Per-account concurrency semaphores preventing upstream rate-limit bursts.
   - Atomic encrypted-at-rest credential storage (ADR 0001).

3. **Production Deployment Ready**
   - Statically linked single binary with zero external dependencies.
   - Native non-root Docker and systemd deployments with graceful connection draining."
